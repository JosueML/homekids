[phases.setup]
nixPkgs = ["nodejs_22", "yarn", "caddy"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare yarn@4.12.0 --activate",
  "yarn install --immutable"
]
cacheDirectories = [".yarn/cache"]

[phases.build]
cmds = ["yarn build"]

[start]
cmd = "caddy file-server --root /app/dist --listen :80"